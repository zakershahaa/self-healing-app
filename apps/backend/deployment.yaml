apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: production
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: backend-sa
      containers:
        - name: backend
          image: zakershaha/zomato_new:latest
          
          # --- SABSE ZAROORI FIXES FOR REACT APP ---
          tty: true               # React app process ko background me zinda rakhne ke liye zaroori hai
          stdin: true             # Terminal support enable karne ke liye
          
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"     # React apps ke bootup ke liye memory badhai hai
            limits:
              cpu: "200m"
              memory: "512Mi"

          # Probes parameters ko React ke build-up time ke hisab se thoda loose kiya hai
          startupProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12  # Total 60 seconds booting time milega React ko

          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5

          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
